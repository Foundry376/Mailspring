name: Build for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Fail if branch is not main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
        run: |
          echo "This workflow should not be triggered with workflow_dispatch on a branch other than main"
          exit 1

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cache NodeJS modules
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            ./app/node_modules
          key: windows-2022-deps-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/package-lock.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build
        env:
          DEBUG: electron-packager

      - name: Sign Application Files with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\app\dist\mailspring-win32-x64
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Set Up Trusted Signing for the Installer Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'trusted-signing'

          # Squirrel signs the binaries it generates itself, so it needs the dlib
          # the azure/trusted-signing-action steps use internally.
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client' -OutFile "$dir.zip"
          Expand-Archive -Path "$dir.zip" -DestinationPath $dir -Force
          $dlib = Get-ChildItem -Path $dir -Filter 'Azure.CodeSigning.Dlib.dll' -Recurse |
            Where-Object { $_.FullName -like '*\x64\*' } | Select-Object -First 1
          if (-not $dlib) { throw 'Could not find Azure.CodeSigning.Dlib.dll' }

          $metadata = Join-Path $dir 'metadata.json'
          @{
            Endpoint = '${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}'
            CodeSigningAccountName = '${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}'
            CertificateProfileName = '${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}'
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8

          # The dlib needs SignTool from Windows SDK 10.0.22621.755 or newer:
          # https://learn.microsoft.com/en-us/azure/trusted-signing/how-to-signing-integrations
          # SDK directories are named for the base release (10.0.22621.0), not the
          # servicing build, so compare against 10.0.22621 and take the newest.
          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'signtool.exe' -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            ForEach-Object {
              $sdk = $_.Directory.Parent.Name -as [version]
              if ($sdk) { [pscustomobject]@{ Version = $sdk; Path = $_.FullName } }
            } | Sort-Object Version | Select-Object -Last 1
          if (-not $signtool -or $signtool.Version -lt [version]'10.0.22621') {
            throw 'Trusted Signing needs SignTool from Windows SDK 10.0.22621.755 or newer'
          }

          "WINDOWS_SIGNTOOL_PATH=$($signtool.Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_SIGN_PARAMS=/v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$($dlib.FullName)`" /dmdf `"$metadata`"" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Windows Installer
        run: node app/build/create-signed-windows-installer.js
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Sign Windows Installer with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\app\dist
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Every Shipped Binary Is Signed
        run: node app/build/verify-windows-signatures.js

      - name: Sync Artifacts to S3
        shell: pwsh
        run: |
          $commit = git rev-parse --short=8 HEAD
          aws s3 sync app/dist/ "s3://mailspring-builds/client/$commit/win-x64" `
            --acl public-read `
            --exclude "*" `
            --include "MailspringSetup.exe" `
            --include "*.nupkg" `
            --include "RELEASES"
