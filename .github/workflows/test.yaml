name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        # The runner image usually has all of these, and its apt mirror is sometimes unreachable.
        run: |
          packages="xvfb libgbm1 libnss3 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64"
          if dpkg -s $packages > /dev/null 2>&1; then
            echo "All present: $packages"
          else
            sudo apt-get update -y -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 $packages
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint:check

      - name: Run Typecheck
        run: npm run typecheck

      # Ubuntu 23.10+ restricts unprivileged user namespaces through AppArmor, so
      # Electron cannot use its namespace sandbox and falls back to the SUID helper,
      # which is not setuid root inside node_modules. Re-allow the namespace sandbox
      # rather than passing --no-sandbox, so the tests run the way the app ships.
      - name: Allow Electron's namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        run: dbus-run-session -- xvfb-run -a npm test
        timeout-minutes: 20
